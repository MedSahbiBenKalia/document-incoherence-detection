# Registre des grandeurs — dimension, rôle et MONOTONIE de chaque type de valeur.
#
# Rempli au J2 (extraction par règles). Vide au J0 : aucune logique métier aujourd'hui.
#
# Ce fichier porte le sens de « plus strict ». Exemples tirés de la vérité terrain :
#   - duree_conservation : plus grand = plus strict   (I03)
#   - seuil_declenchement : plus grand = plus permissif (I13, « à plus de 3 m » est plus
