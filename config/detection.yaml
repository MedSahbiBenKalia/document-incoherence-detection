# Détection (L4) — algèbre des conditions, échelle déontique, gravité.
#
# Rempli au J5. Aucune de ces valeurs ne vit dans un `.py` (CLAUDE.md) : ni la hiérarchie
# des lieux, ni l'échelle de force, ni les bornes de gravité.
#
# Le sens de « plus strict » n'est PAS ici : il est dans `config/registre_grandeurs.yaml`,
# rôle par rôle, et dénormalisé sur chaque grandeur à l'extraction.

# --------------------------------------------------------------- algèbre des conditions
#
# architecture.md §5.7, niveaux 1 et 2 seulement — règles typées, sans modèle. Le niveau 3
# (vecteur) et le niveau 4 (LLM sur zone grise) sont le J6 : tout ce que les règles ne
# tranchent pas part en file d'attente, et aucune arête n'est écrite.

conditions:

  lieux:
    # Formes de surface équivalentes, ramenées à un même lieu avant toute comparaison.
    # « sur l'ensemble du site » désigne le site entier, ce n'est pas une partie du site :
    # sans cette table, ce serait un frère de « zone A » et donc DISJOINT à tort.
    synonymes:
      ensemble du site: site de rades

    # lieu -> parent immédiat. `null` = racine.
    # Un lieu ABSENT de cette table est un lieu inconnu : la relation vaut INDETERMINEE et
    # part en file d'attente. On ne déduit JAMAIS une disjonction d'une ignorance — un rejet
    # est définitif et silencieux, une escalade reste visible (.claude/rules/detection.md).
    parents:
      site de rades: null
      zone a: site de rades
      zone de stockage: site de rades

  # Une condition dont la surface CONTIENT la surface d'une grandeur déjà extraite sur la
  # même clause ne restreint pas la portée : elle redit la grandeur. « pour les
  # interventions réalisées à plus de 3 mètres » face à la grandeur « 3 mètres » n'est pas
  # un sous-cas, c'est la même contrainte formulée deux fois par deux extracteurs.
  #
  # Mesuré au J5 : exactement 3 conditions du corpus sont dans ce cas — D1 §7.1, D2 §7.1
  # (I13) et D2 §5.5 (I14). Sans cette règle, I13 devient INDETERMINEE (deux conditions
  # POPULATIONNELLES incomparables) et I14 devient une SPÉCIALISATION (D2 conditionnée,
  # plus stricte) : les deux incohérences disparaissent. Aucune autre condition du corpus
  # n'est touchée — celle de N01 (« En cas d'accident... ») ne contient pas « 24 heures ».
  ignorer_les_conditions_qui_redisent_une_grandeur: true

# ------------------------------------------------------------------ échelle déontique
#
# architecture.md §7.1, A1. La force est RECALCULÉE ici depuis la modalité, jamais reprise
# de `ClauseFrame.force` : `regles/deontique.py` inverse la modalité sous l'effet d'une
# négation sans toucher à la force, si bien qu'un « ne doit pas » rend INTERDICTION avec
# force 3. C'est la modalité qui fait foi, la force n'en est que la projection.

deontique:
  echelle:
    INTERDICTION: 4
    OBLIGATION: 3
    RECOMMANDATION: 2
    PERMISSION: 1

  # ecart >= ce seuil -> conflit fort et ferme. ecart == 1 -> DIVERGENCE_PERSPECTIVE,
  # non ferme, escalade obligatoire vers l'étage B (I05). ecart == 0 -> rien (N02, N09).
  ecart_conflit_fort: 2

  # Polarités qui s'excluent : conflit fort QUEL QUE SOIT l'écart. Redondant avec le seuil
  # sur ce corpus (I04 mesure déjà un écart de 3), mais c'est la règle de l'architecture et
  # elle doit être lisible ailleurs que dans un commentaire.
  polarites_opposees:
    - [OBLIGATION, INTERDICTION]
    - [PERMISSION, INTERDICTION]
    - [RECOMMANDATION, INTERDICTION]

# ------------------------------------------------------- ce qui autorise un verdict ferme
#
# ⭐ LE GARDE-FOU DE PRÉCISION DU J5. Il ne rejette rien : il ESCALADE vers les étages B
# et C du J6 (`.claude/rules/detection.md`).
#
# **La question qu'il pose.** Le ciblage établit que deux clauses méritent d'être
# examinées ; il n'établit pas qu'elles parlent de la même chose. Le canal DIMENSION en
# particulier n'atteste que l'égalité de la grandeur mesurée et de son rôle — c'est un
# filet de rappel (architecture.md §6.5). Comparer deux valeurs suppose de plus qu'elles
# portent sur le même objet, ce que dit la clé de comparaison de §5.8.
#
# **Le seuil, et pourquoi 2.** C'est celui du canal conceptuel — `partages_min: 2` dans
# `config/ciblage.yaml`, architecture.md §6.3 — appliqué aux seuls concepts de type OBJET
# au lieu de tous. Ce n'est donc pas un paramètre inventé pour ce corpus : c'est un
# paramètre existant, déjà justifié, transposé d'un étage à l'autre.
#
# **Distribution mesurée** sur les 72 paires candidates du J4 :
#     0 objet partagé  : 29 paires      3 objets : 8
#     1 objet partagé  : 11 paires      4 objets : 3
#     2 objets partagés: 20 paires      7 objets : 1
# 40 paires sous le seuil, 32 au-dessus.
#
# **Ce qu'il corrige, mesuré.** Sans lui, A2 rend 4 constatations fausses — D1 §5.3 ↔
# D2 §5.1, D1 §6.5 ↔ D2 §6.5, D1 §6.3 ↔ D2 §4.5, D1 §6.5 ↔ D2 §5.1 — toutes de la même
# forme : même rôle, valeurs différentes, objets sans rapport. Précision 12/16 = 0,75.
# Avec lui : 0 faux positif, précision 1,00.
#
# **Un garde-fou envisagé puis retiré, parce que MESURÉ inutile.** On avait d'abord posé
# une garde sur les canaux du ciblage (« un verdict ferme exige un canal CLE, CONCEPTUEL ou
# VECTORIEL »). Sur les 72 paires candidates : 26 échouent aux deux gardes, 14 n'échouent
# qu'à celle des objets, et **aucune n'échoue qu'à celle des canaux**. La garde des canaux
# est donc strictement redondante ici. Elle a été retirée plutôt que conservée en no-op :
# deux gardes dont une ne travaille jamais rendent le chiffre de précision inexplicable.
#
# **Prix payé, et il est consigné en rouge au Journal.** I12 (D1 §6.2 ↔ D2 §6.2) partage
# **zéro** objet canonique avec sa partenaire — `anomalie`/`écart` et `chef d'atelier`/
# `hiérarchie` sont sous le seuil d'alias depuis le J3, volontairement. Elle escalade donc,
# là où `label.json` l'attend à l'étage A. Aucun séparateur symbolique ne la distingue de
# N08, qui a exactement le même profil et doit, lui, être rejeté.
#
# I03 escalade aussi (1 seul objet partagé, le générique « contrôle ») — et c'est
# exactement ce que `label.json` prévoit : `etage_attendu: "C"`.
#
# ⚠️ Ce garde-fou ne s'applique PAS à A5 : une divergence de référentiel s'établit contre
# `registre_normes.yaml`, pas contre un recouvrement d'objets. I08 partage zéro objet et
# reste une constatation ferme, à juste titre.

preuve:
  objets_partages_min: 2

# ------------------------------------------------------------------------------ gravité
#
# Écart relatif |a - b| / max(a, b) -> gravité du constat numérique (A2).
# Bornes inclusives par le bas, lues dans l'ordre décroissant.

gravite:
  seuils_ecart_relatif:
    - {a_partir_de: 0.60, gravite: CRITIQUE}
    - {a_partir_de: 0.30, gravite: ELEVEE}
    - {a_partir_de: 0.10, gravite: MOYENNE}
    - {a_partir_de: 0.00, gravite: FAIBLE}

# ------------------------------------------------------------------ étage B — le NLI
#
# architecture.md §7.3. Rempli au J8, APRÈS la mesure — les seuils de §7.3 (0,85 / 0,15)
# sont des valeurs de départ que le plan interdit explicitement de recopier, et la mesure
# montre qu'elles seraient nocives ici.
#
# **La mesure.** 57 paires (celles que `paires_a_juger` soumet au juge), inférence dans les
# deux sens, `max P(contradiction)` retenu comme le veut §7.3. Distribution obtenue :
#
#     [0.00;0.05) 3   [0.25;0.30) 4   [0.50;0.55) 6   [0.75;0.80) 3
#     [0.05;0.10) 3   [0.30;0.35) 3   [0.55;0.60) 2   [0.80;0.85) 1
#     [0.10;0.15) 4   [0.35;0.40) 3   [0.60;0.65) 2   [0.85;0.90) 3
#     [0.15;0.20) 4   [0.40;0.45) 3   [0.65;0.70) 3   [0.90;0.95) 1
#     [0.20;0.25) 2   [0.45;0.50) 3   [0.70;0.75) 3   [0.95;1.00) 1
#
#     min 0,0172 · médiane 0,4372 · max 0,9535
#
# La distribution est ÉTALÉE sur toute la plage : le modèle a un avis sur tout, ce qui est
# la marque d'un classifieur générique appliqué à du français normatif. Elle n'offre que
# deux frontières franches, et ce sont elles qui fixent les deux seuils ci-dessous :
#     écart de 0,0556 entre 0,0635 et 0,1191  ->  6 paires en dessous
#     écart de 0,0595 entre 0,8025 et 0,8620  ->  5 paires au-dessus
#
# ⚠️ Les seuils viennent de ces DEUX ÉCARTS, pas des cas de label.json qu'ils séparent.
# Le placement des cas nommés a été relevé APRÈS coup, et n'a déplacé aucune borne.

nli:
  # Plancher de fermeture. `max P(contradiction) <= seuil_rejet` -> la paire est close,
  # motif REJET_NLI, et elle n'atteint jamais le LLM. Retenir le MAXIMUM des deux sens
  # signifie qu'une fermeture exige l'accord des deux sens : c'est la borne prudente.
  #
  # 0,09 = milieu de l'écart 0,0635 / 0,1191. Ferme 6 paires sur 57.
  #
  # ⚠️ 0,15 — la valeur de départ de §7.3 — fermerait 10 paires, mais parmi elles I19
  # (0,1394), une vraie incohérence que l'étage C constate aujourd'hui. Le seuil théorique
  # est donc NOCIF sur ce corpus. Il n'a pas été retenu, et il n'a pas été « arrondi » :
  # c'est la distribution qui borne, et elle borne à 0,09.
  seuil_rejet: 0.09

  # ⚠️ CE SEUIL NE FERME RIEN, ET NE CONCLUT RIEN. Il ne sert qu'à ranger les scores en
  # trois zones dans le rapport. Il n'existe volontairement aucun motif « contradiction
  # NLI » dans `Motif` : l'étage B n'affirme jamais.
  #
  # **Pourquoi, mesuré.** À ce seuil la bande haute contient 5 paires des 57 : I03 (vraie,
  # non détectée), I06 (vraie, hors périmètre) — et aussi l'un des trois faux positifs de
  # l'étage C (D1 §6.3 ↔ D2 §4.2, à 0,910) et le contre-exemple N05 (D1 §10.1 ↔ D2 §6.4,
  # à 0,862), qui doit rester silencieux. Un étage B qui affirmerait à partir de là
  # ajouterait AU MOINS DEUX constatations fausses et casserait le critère « 0 faux
  # positif ». Second motif, indépendant : le NLI ne produit aucune citation, et
  # l'invariant #3 de CLAUDE.md interdit un verdict sans preuve littérale.
  #
  # 0,83 = milieu de l'écart 0,8025 / 0,8620.
  seuil_contradiction: 0.83

  # Lots d'inférence (architecture.md §7.3). Mesuré : 114 inférences en 2,7 s sur CPU,
  # soit 47 ms/paire pour les deux sens — le modèle se charge en 1,4 s de plus.
  taille_lot: 32

# ---------------------------------------------------------------- étage C — le LLM juge
#
# architecture.md §7.4. Rempli au J6.
#
# **Le périmètre, et pourquoi il n'est pas « les escalades ».** La consigne du J6 élargit le
# juge à toutes les paires que le symbolique n'a pas conclues — non pour garantir qu'elles
# se débloquent, mais pour qu'aucune ne soit écartée PAR CONSTRUCTION. Prendre
# `Detection.escalades` à la lettre manquerait I11 (D1 §6.1 / D2 §6.1), que `label.json`
# désigne pourtant comme « le cas qui justifie l'étage C » : sans modalité ni grandeur, elle
# produit trois verdicts AUCUNE et tombe dans `muets`, pas dans `escalades`.
#
# Le tri se fait donc sur le MOTIF, et il distingue deux silences :
#   - « je n'ai pas de donnée »        -> le juge doit voir la paire (I11)
#   - « j'ai établi la compatibilité » -> rejet fondé, la paire est close (N06, N09)
#
# Mesuré au J6 sur les 72 paires candidates du J4 :
#     ELIGIBLE_ESCALADE          36   (OBJETS_SANS_RECOUVREMENT 34, PORTEE_INDETERMINEE 1,
#                                      ECART_DE_FORCE 1)
#     ELIGIBLE_SANS_DONNEE       21
#     CONCLUE (verdict ferme)     8
#     FERMEE_COMPATIBILITE        6   (VALEURS_EGALES 5, ECART_DE_FORCE_NUL 1)
#     FERMEE_PORTEES_DISJOINTES   1
#   -> 57 paires éligibles, + 2 appels d'arbitrage d'alias = 59 appels.
#
# Contrôle contre label.json : I03, I05, I11 et I12 atteignent le juge ; N04, N06 et N09
# sont écartées ; N02 et N03 ne sont même pas candidates. N08 atteint le juge — c'est le
# seul contre-exemple du périmètre dans ce cas, et le risque de faux positif de la journée.

juge:
  # Motifs qui FERMENT la paire : le symbolique a positivement établi la compatibilité.
  # Y ajouter un motif, c'est retirer des paires au juge — à ne faire que sur mesure.
  motifs_fermants:
    - VALEURS_EGALES
    - ECART_DE_FORCE_NUL
    - PORTEES_DISJOINTES
    # J8 — l'étage B a fermé la paire par le bas. C'est par CETTE ligne, et non par du code
    # neuf dans `paires_a_juger`, que le NLI retire des paires au juge.
    - REJET_NLI

  # ⭐ La disjonction des portées est testée SUR LA PAIRE, pas seulement sur le motif d'un
  # détecteur. architecture.md §7.2 en fait une propriété de la paire (« disjointes ->
  # aucun conflit »), et aucun détecteur ne l'atteint quand il s'arrête plus tôt : sur N04,
  # A2 rend PAS_DE_GRANDEUR_COMPARABLE et A1 rend MODALITE_ABSENTE, si bien que le motif
  # PORTEES_DISJOINTES n'est jamais posé. Sans ce contrôle, N04 part au juge — mesuré.
  ecarter_les_portees_disjointes: true

  # Plafond d'appels RÉSEAU pour l'ensemble du corpus. Un accès servi par le cache ne
  # consomme rien. Atteint -> les paires restantes sont marquées NON_VERIFIEE_BUDGET et
  # NOMMÉES dans le rapport (garde-fou n°5), jamais silencieusement rejetées.
  #
  # ⚠️ PORTÉ DE 60 À 200 APRÈS MESURE. À 60, le plafond a mordu en exécution : 60 appels
  # réseau pour 34 paires seulement, parce que le profil local ne sait pas contraindre son
  # décodage et que chaque réparation coûte un appel. 13 paires — dont I03 — n'ont jamais
  # été soumises. Le plafond mesurait alors la faiblesse du modèle, pas celle du corpus.
  #
  # 200 est délibérément hors d'atteinte sur ce corpus : 57 paires + 2 alias = 59 appels
  # nominaux, et même à deux appels par paire on reste sous la barre. Le mécanisme n'est
  # pas neutralisé pour autant — il reste exercé par un test à budget forcé à 3.
  #
  # ⚠️ ÉCART AU PLAN, signalé et non maquillé : `docs/plan-1-semaine.md` §J6 chiffre
  # « <= 15 appels LLM » et son tableau de bord « ~14 ». Le périmètre élargi mène à 59
  # nominal, et la consigne du J6 avait d'abord fixé 60.
  max_appels: 200

  # Après ce nombre d'échecs de transport CONSÉCUTIFS, le juge cesse d'appeler et marque
  # tout le reste en abstention d'un coup. Sans coupe-circuit, un LM Studio éteint coûte
  # 57 x timeout_s (~28 min) avant de rendre la main, pour zéro information.
  echecs_consecutifs_max: 3

  # En deçà, un verdict du juge n'est pas ferme : il devient une abstention. Le LLM n'est
  # jamais seul décisionnaire d'un verdict grave (architecture.md §7.4, R2 de §13).
  confiance_min: 0.70

  # Température de jugement (architecture.md §12). Basse : on veut un arbitre reproductible,
  # pas un rédacteur. Elle entre dans la clé de cache.
  temperature: 0.2

  # Nombre de caractères de texte_autonome injectés par clause dans le prompt. Garde-fou
  # de coût : le contexte de LM Studio est de 8192 jetons, sous-graphe compris.
  longueur_max_texte: 600
