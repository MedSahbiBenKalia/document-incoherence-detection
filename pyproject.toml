[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohera"
version = "0.1.0"
description = "Détection d'incohérences inter-documents QHSE par graphe de dépendances"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "neo4j>=6.0",
    "spacy>=3.8",
    "sentence-transformers>=5.0",
    "transformers>=4.45",
    # Requis par le tokenizer de `cmarkea/distilcamembert-base-nli` (étage B, NLI) : sans
    # eux, `AutoTokenizer.from_pretrained` échoue à l'exécution — `transformers` ne les
    # installe pas lui-même, ce sont des extras que le modèle CamemBERT exige au chargement.
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "torch>=2.6",
    "numpy>=1.26",
    "pydantic>=2.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cohera = "cohera.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["cohera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Premier marqueur du dépôt, introduit au J3. La convention jusqu'ici était d'isoler la
# fonction pure et de tester sans serveur (cf. graphe/compat.py et tests/test_compat.py) —
# elle reste la règle. Mais l'idempotence du chargement ne se démontre PAS sans serveur :
# c'est justement le comportement de Neo4j qu'on vérifie. D'où ce marqueur, et le
# `skipif` qui l'accompagne dans tests/test_chargeur.py.
# ⚠️ Un test sauté n'est pas un test vert : la vérification de fin de journée compte les
# skips explicitement.
markers = [
    "neo4j: exige un serveur Neo4j joignable (docker compose up -d)",
]
