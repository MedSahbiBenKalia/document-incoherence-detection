[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohera"
version = "0.1.0"
description = "Détection d'incohérences inter-documents QHSE par graphe de dépendances"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "neo4j>=6.0",
    "spacy>=3.8",
    "sentence-transformers>=5.0",
    "transformers>=4.45",
    "torch>=2.6",
    "pydantic>=2.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cohera = "cohera.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["cohera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
